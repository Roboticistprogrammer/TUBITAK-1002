services:
  pipeline:
    build:
      context: .
      dockerfile: containers/Dockerfile
    image: tubitak-student-deployment:cuda13-trt10.13
    working_dir: /workspace
    gpus: all
    shm_size: "8gb"
    volumes:
      - .:/workspace
      - ${DATASETS_DIR:-./datasets}:/workspace/datasets:ro
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
